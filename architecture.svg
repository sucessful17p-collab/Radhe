<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">SignalWard confidence-aware architecture</title><desc id="desc">Synthetic sensor packets branch into a patient trajectory model, an evidence-confidence gate, and equipment context. A decision layer withholds the patient score for weak evidence and routes an evidence check. Results appear in a local dashboard and SQLite store with an offline browser outbox.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#f5f8fa"/><stop offset="1" stop-color="#edf4f6"/></linearGradient><linearGradient id="teal" x2="1" y2="1"><stop stop-color="#1da58f"/><stop offset="1" stop-color="#157c74"/></linearGradient><marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M1 1 10 6 1 11" fill="none" stroke="#6b8891" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker><filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="7" stdDeviation="10" flood-color="#23465a" flood-opacity=".08"/></filter></defs>
<rect width="1600" height="900" fill="url(#bg)"/><text x="72" y="78" fill="#168776" font-family="Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="3">SIGNALWARD / SYSTEM DESIGN</text><text x="72" y="134" fill="#1b2a39" font-family="Arial,sans-serif" font-size="39" font-weight="700">Separate patient risk from signal trust</text><text x="72" y="169" fill="#718090" font-family="Arial,sans-serif" font-size="18">Confidence gate decides whether a synthetic patient-state score can be shown</text>
<!-- Sensor -->
<g filter="url(#shadow)"><rect x="72" y="285" width="260" height="300" rx="20" fill="#fff" stroke="#dce6eb"/><rect x="72" y="285" width="260" height="58" rx="20" fill="#19394b"/><path d="M72 322v21h260v-21" fill="#19394b"/><text x="97" y="322" fill="#fff" font-family="Arial,sans-serif" font-size="17" font-weight="700">SIMULATED INPUT</text><text x="97" y="383" fill="#168776" font-family="Arial,sans-serif" font-size="12" font-weight="700">PATIENT SIGNALS</text><text x="97" y="410" fill="#334959" font-family="Arial,sans-serif" font-size="15">Vitals + recent direction</text><text x="97" y="446" fill="#168776" font-family="Arial,sans-serif" font-size="12" font-weight="700">EVIDENCE SIGNALS</text><text x="97" y="473" fill="#334959" font-family="Arial,sans-serif" font-size="15">Quality + freshness</text><text x="97" y="509" fill="#a67521" font-family="Arial,sans-serif" font-size="12" font-weight="700">CARE CONTEXT</text><text x="97" y="536" fill="#334959" font-family="Arial,sans-serif" font-size="15">Device + caregiver note</text><text x="97" y="565" fill="#8996a2" font-family="Arial,sans-serif" font-size="11">All generated · no hardware</text></g>
<!-- Model -->
<g filter="url(#shadow)"><rect x="430" y="225" width="315" height="170" rx="18" fill="#fff" stroke="#dce6eb"/><circle cx="468" cy="270" r="16" fill="#e8f6f1"/><path d="M460 270h16m-8-8v16" stroke="#168776" stroke-width="2" stroke-linecap="round"/><text x="498" y="266" fill="#1b2a39" font-family="Arial,sans-serif" font-size="17" font-weight="700">Patient trajectory model</text><text x="458" y="315" fill="#657789" font-family="Arial,sans-serif" font-size="14">Synthetic logistic regression</text><text x="458" y="343" fill="#657789" font-family="Arial,sans-serif" font-size="14">Baseline deltas + note + trend</text><text x="458" y="370" fill="#a67521" font-family="Arial,sans-serif" font-size="12" font-weight="700">24–48H TOY LABEL · NOT CLINICAL</text></g>
<g filter="url(#shadow)"><rect x="430" y="445" width="315" height="170" rx="18" fill="#fff" stroke="#dce6eb"/><circle cx="468" cy="490" r="16" fill="#fff3df"/><path d="M460 490h16m-8-8v16" stroke="#b98428" stroke-width="2" stroke-linecap="round"/><text x="498" y="486" fill="#1b2a39" font-family="Arial,sans-serif" font-size="17" font-weight="700">Evidence confidence gate</text><text x="458" y="535" fill="#657789" font-family="Arial,sans-serif" font-size="14">Signal quality + packet age</text><text x="458" y="563" fill="#657789" font-family="Arial,sans-serif" font-size="14">Low trust → withhold score</text><text x="458" y="590" fill="#a67521" font-family="Arial,sans-serif" font-size="12" font-weight="700">SEPARATE FROM PATIENT RISK</text></g>
<!-- context -->
<g filter="url(#shadow)"><rect x="430" y="665" width="315" height="105" rx="17" fill="#fff" stroke="#dce6eb"/><text x="458" y="704" fill="#1b2a39" font-family="Arial,sans-serif" font-size="16" font-weight="700">Equipment + caregiver context</text><text x="458" y="737" fill="#657789" font-family="Arial,sans-serif" font-size="14">Power · device · multilingual phrasebook</text></g>
<!-- decision -->
<g filter="url(#shadow)"><rect x="850" y="350" width="265" height="238" rx="22" fill="url(#teal)"/><text x="880" y="394" fill="#d9fff5" font-family="Arial,sans-serif" font-size="12" font-weight="700" letter-spacing="1">DECISION GATE</text><text x="880" y="433" fill="#fff" font-family="Arial,sans-serif" font-size="20" font-weight="700">Can we trust</text><text x="880" y="460" fill="#fff" font-family="Arial,sans-serif" font-size="20" font-weight="700">this packet?</text><path d="M880 482h205" stroke="#8fd9cb"/><text x="880" y="516" fill="#fff" font-family="Arial,sans-serif" font-size="14">Reliable → show trajectory + reasons</text><text x="880" y="545" fill="#fff" font-family="Arial,sans-serif" font-size="14">Weak → Evidence Check, score hidden</text><text x="880" y="571" fill="#d9fff5" font-family="Arial,sans-serif" font-size="11">Device issue stays its own alert type</text></g>
<!-- output -->
<g filter="url(#shadow)"><rect x="1220" y="260" width="310" height="385" rx="20" fill="#fff" stroke="#dce6eb"/><rect x="1220" y="260" width="310" height="58" rx="20" fill="#19394b"/><path d="M1220 297v21h310v-21" fill="#19394b"/><text x="1247" y="297" fill="#fff" font-family="Arial,sans-serif" font-size="17" font-weight="700">LOCAL CARE DASHBOARD</text><rect x="1247" y="348" width="256" height="92" rx="12" fill="#eff8f5"/><text x="1265" y="378" fill="#168776" font-family="Arial,sans-serif" font-size="12" font-weight="700">PATIENT TREND</text><text x="1265" y="408" fill="#334959" font-family="Arial,sans-serif" font-size="15">Score + contributing factors</text><rect x="1247" y="453" width="256" height="78" rx="12" fill="#fff6e8"/><text x="1265" y="482" fill="#a67521" font-family="Arial,sans-serif" font-size="12" font-weight="700">EVIDENCE CHECK</text><text x="1265" y="510" fill="#334959" font-family="Arial,sans-serif" font-size="14">Score withheld · verify input</text><rect x="1247" y="544" width="256" height="72" rx="12" fill="#f1f5f7"/><text x="1265" y="573" fill="#547181" font-family="Arial,sans-serif" font-size="12" font-weight="700">HUMAN RESPONSE</text><text x="1265" y="600" fill="#334959" font-family="Arial,sans-serif" font-size="14">Acknowledge · log activity</text></g>
<!-- offline store -->
<g filter="url(#shadow)"><rect x="850" y="675" width="680" height="105" rx="18" fill="#fff" stroke="#dce6eb"/><text x="882" y="714" fill="#1b2a39" font-family="Arial,sans-serif" font-size="16" font-weight="700">Offline continuity</text><text x="882" y="746" fill="#657789" font-family="Arial,sans-serif" font-size="14">Browser outbox queues synthetic actions · reconnect syncs · SQLite stores local history</text></g>
<!-- arrows -->
<path d="M332 430h62v-120h26" stroke="#6b8891" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M394 430v100h36" stroke="#6b8891" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M745 310h57v130h48" stroke="#6b8891" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M745 530h105" stroke="#6b8891" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M745 718h55v-76h182v-54h88" stroke="#6b8891" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M1115 469h105" stroke="#6b8891" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<text x="72" y="842" fill="#8a98a5" font-family="Arial,sans-serif" font-size="12">Safety boundary: all signals and labels are synthetic. The demo is not a clinical device and must not guide care.</text>
</svg>
